<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="PaySlip launch card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241f5c"/>
      <stop offset="45%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7ddf2"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.13" stroke="#8b5cf6" stroke-width="1">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <circle cx="1230" cy="450" r="420" fill="url(#halo)"/>

  <!-- logo mark -->
  <g transform="translate(1030 250) scale(0.98)">
    <circle cx="200" cy="200" r="200" fill="#050914"/>
    <circle cx="200" cy="200" r="187" fill="none" stroke="url(#ring)" stroke-width="8"/>
    <circle cx="200" cy="200" r="169" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>
    <g transform="rotate(-6 200 196)">
      <path fill="url(#paper)" d="M132 106 h136 a16 16 0 0 1 16 16 v146 l-17 14 -17 -14 -17 14 -17 -14 -17 14 -17 -14 -17 14 -17 -14 V122 a16 16 0 0 1 16 -16 z"/>
      <rect x="154" y="136" width="52" height="12" rx="6" fill="#8b93ad"/>
      <rect x="154" y="166" width="46" height="11" rx="5.5" fill="#c3cbdd"/>
      <rect x="154" y="192" width="34" height="11" rx="5.5" fill="#c3cbdd"/>
      <rect x="154" y="218" width="42" height="11" rx="5.5" fill="#c3cbdd"/>
    </g>
    <path transform="translate(140 121) scale(1.5)" d="M58 4 L18 56 H44 L38 96 L82 42 H54 Z"
          fill="url(#bolt)" stroke="#0b1020" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <!-- copy -->
  <g font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif">
    <g transform="translate(110 196)">
      <rect x="0" y="-30" width="316" height="44" rx="22" fill="#6366f1" fill-opacity="0.16" stroke="#6366f1" stroke-opacity="0.55"/>
      <text x="24" y="1" font-size="19" font-weight="700" letter-spacing="3.4" fill="#a5b4fc">NOW LIVE ON TESTNET</text>
    </g>

    <text x="110" y="330" font-size="102" font-weight="800" letter-spacing="-3" fill="url(#head)">PaySlip</text>
    <text x="110" y="430" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#e2e8f0">Payroll at the speed</text>
    <text x="110" y="500" font-size="58" font-weight="700" letter-spacing="-1.2" fill="#e2e8f0">of a block.</text>

    <text x="110" y="572" font-size="30" font-weight="500" fill="#94a3b8">On-chain ETH payroll on Robinhood Chain.</text>

    <g font-size="24" font-weight="600">
      <g transform="translate(110 630)">
        <rect width="268" height="60" rx="30" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
        <text x="34" y="38" fill="#67e8f9">⚡ Instant settlement</text>
      </g>
      <g transform="translate(398 630)">
        <rect width="238" height="60" rx="30" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.45"/>
        <text x="32" y="38" fill="#c4b5fd">🌍 Pay anywhere</text>
      </g>
      <g transform="translate(656 630)">
        <rect width="272" height="60" rx="30" fill="#0f172a" stroke="#10b981" stroke-opacity="0.45"/>
        <text x="30" y="38" fill="#6ee7b7">🔒 Proof on-chain</text>
      </g>
    </g>

    <text x="110" y="782" font-size="24" font-weight="600" letter-spacing="1.4" fill="#64748b">EMPLOYER DASHBOARD  ·  BULK DISBURSE  ·  PDF PAYSLIPS</text>
  </g>
</svg>
