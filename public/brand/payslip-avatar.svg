<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="PaySlip logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241f5c"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7ddf2"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="187" fill="none" stroke="url(#ring)" stroke-width="8"/>
  <circle cx="200" cy="200" r="169" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3"/>

  <!-- payslip document, torn bottom edge -->
  <g transform="rotate(-6 200 196)">
    <path fill="url(#paper)" d="
      M132 106
      h136
      a16 16 0 0 1 16 16
      v146
      l-17 14 -17 -14 -17 14 -17 -14
      -17 14 -17 -14 -17 14 -17 -14
      V122
      a16 16 0 0 1 16 -16 z"/>
    <rect x="154" y="136" width="52" height="12" rx="6" fill="#8b93ad"/>
    <rect x="154" y="166" width="46" height="11" rx="5.5" fill="#c3cbdd"/>
    <rect x="154" y="192" width="34" height="11" rx="5.5" fill="#c3cbdd"/>
    <rect x="154" y="218" width="42" height="11" rx="5.5" fill="#c3cbdd"/>
  </g>

  <!-- instant-payment bolt -->
  <path transform="translate(140 121) scale(1.5)"
        d="M58 4 L18 56 H44 L38 96 L82 42 H54 Z"
        fill="url(#bolt)" stroke="#0b1020" stroke-width="5.5" stroke-linejoin="round"/>
</svg>
