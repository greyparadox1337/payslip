name: CI — PaySlip

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run ESLint
        run: npx eslint . --ext .ts,.tsx --max-warnings 50
        continue-on-error: true

      - name: Build project
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://placeholder.vercel.app
          NEXT_PUBLIC_CHAIN_ENV: testnet
          NEXT_PUBLIC_ROBINHOOD_RPC: https://rpc.testnet.chain.robinhood.com

      - name: Build status
        run: echo "✅ Build completed successfully"

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for exposed secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -r "NEXTAUTH_SECRET\s*=" --include="*.ts" --include="*.tsx" \
            --exclude-dir=".next" --exclude-dir="node_modules" . | \
            grep -v ".env" | grep -v "process.env"; then
            echo "❌ Potential secret exposure found"
            exit 1
          else
            echo "✅ No hardcoded secrets found"
          fi

      - name: Check for mainnet references
        run: |
          echo "Checking for mainnet references..."
          if grep -rn "mainnet.chain.robinhood.com" --include="*.ts" --include="*.tsx" \
            --exclude-dir=".next" --exclude-dir="node_modules" \
            --exclude="chains.ts" . ; then
            echo "❌ Robinhood Chain mainnet RPC used outside src/lib/chains.ts — must use testnet"
            exit 1
          else
            echo "✅ All Robinhood Chain references use testnet"
          fi

      - name: Verify .env.local is gitignored
        run: |
          if [ -f ".gitignore" ] && grep -q ".env.local" .gitignore; then
            echo "✅ .env.local is properly gitignored"
          else
            echo "❌ .env.local must be in .gitignore"
            exit 1
          fi
